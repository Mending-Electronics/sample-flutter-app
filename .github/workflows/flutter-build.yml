name: Flutter builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: apk
            runner: ubuntu-latest
            artifact: sample_flutter_app/build/app/outputs/flutter-apk/app-release.apk
          - platform: linux
            runner: ubuntu-latest
            artifact: sample_flutter_app/build/linux/x64/release/bundle/
          - platform: windows
            runner: windows-latest
            artifact: sample_flutter_app/build/windows/x64/runner/Release/
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sample_flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config
      - name: Set up Java for Android
        if: matrix.platform == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter build ${{ matrix.platform }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
