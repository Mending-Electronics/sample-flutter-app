name: Flutter builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sample_flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run tests
        run: flutter test

  sonarqube:
    needs: [test, build]
    if: >-
      ${{
        vars.SONAR_ORGANIZATION != '' &&
        vars.SONAR_PROJECT_KEY != '' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sample_flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build for SonarQube analysis
        run: flutter build web --release
      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: sample_flutter_app
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=lib
            -Dsonar.tests=test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: apk
            runner: ubuntu-24.04
            artifact: sample_flutter_app/build/app/outputs/flutter-apk/app-release.apk
          - platform: linux
            runner: ubuntu-24.04
            artifact: sample_flutter_app/build/linux/x64/release/bundle/
          - platform: windows
            runner: windows-latest
            artifact: sample_flutter_app/build/windows/x64/runner/Release/
          - platform: macos
            runner: macos-latest
            artifact: sample_flutter_app/build/macos/Build/Products/Release/sample_flutter_app.app
          - platform: ios
            runner: macos-latest
            artifact: sample_flutter_app/build/ios/iphoneos/Runner.app
          - platform: web
            runner: ubuntu-24.04
            artifact: sample_flutter_app/build/web/
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sample_flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config
      - name: Set up Java for Android
        if: matrix.platform == 'apk'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Build release
        if: matrix.platform != 'ios'
        run: flutter build ${{ matrix.platform }} --release
      - name: Build iOS release without code signing
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v5
        with:
          name: flutter-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [test, build, sonarqube]
    if: >-
      ${{
        always() &&
        startsWith(github.ref, 'refs/tags/v') &&
        needs.test.result == 'success' &&
        needs.build.result == 'success' &&
        (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Archive build artifacts
        run: |
          compgen -G "release-assets/flutter-*" >/dev/null || {
            echo "No Flutter build artifacts were downloaded." >&2
            exit 1
          }
          for artifact_dir in release-assets/flutter-*; do
            if [ -d "$artifact_dir" ]; then
              zip -r "${artifact_dir}.zip" "$artifact_dir"
            fi
          done
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*.zip
