name: Flutter builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: apk
            runner: ubuntu-24.04
            artifact: sample_flutter_app/build/app/outputs/flutter-apk/app-release.apk
          - platform: linux
            runner: ubuntu-24.04
            artifact: sample_flutter_app/build/linux/x64/release/bundle/
          - platform: windows
            runner: windows-latest
            artifact: sample_flutter_app/build/windows/x64/runner/Release/
          - platform: macos
            runner: macos-latest
            artifact: sample_flutter_app/build/macos/Build/Products/Release/sample_flutter_app.app
          - platform: ios
            runner: macos-latest
            artifact: sample_flutter_app/build/ios/iphoneos/Runner.app
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sample_flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config
      - name: Set up Java for Android
        if: matrix.platform == 'apk'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Build release
        if: matrix.platform != 'ios'
        run: flutter build ${{ matrix.platform }} --release
      - name: Build iOS release without code signing
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v5
        with:
          name: flutter-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
