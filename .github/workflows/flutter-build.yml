name: Flutter builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sample_flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run tests
        run: flutter test

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build_name: ${{ steps.resolve.outputs.build_name }}
      channel: ${{ steps.resolve.outputs.channel }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve version and release tag
        id: resolve
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          manifest_version="$(sed -n 's/^version: *\([^[:space:]]*\).*/\1/p' sample_flutter_app/pubspec.yaml)"
          if [[ ! "$manifest_version" =~ $semver_pattern ]]; then
            echo "Invalid SemVer in sample_flutter_app/pubspec.yaml: $manifest_version" >&2
            exit 1
          fi

          should_release=false
          tag=""
          version="${manifest_version%%+*}"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            if [[ "$tag" != v* || ! "$version" =~ $semver_pattern ]]; then
              echo "Release tags must use the vX.Y.Z SemVer format: $tag" >&2
              exit 1
            fi
            should_release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            previous_manifest_version=""
            if [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              if ! git cat-file -e "$PUSH_BEFORE^{commit}"; then
                echo "Could not find the previous commit $PUSH_BEFORE." >&2
                exit 1
              fi
              previous_manifest_version="$(
                git show "$PUSH_BEFORE:sample_flutter_app/pubspec.yaml" |
                  sed -n 's/^version: *\([^[:space:]]*\).*/\1/p'
              )"
            fi

            current_release_version="${manifest_version%%+*}"
            previous_release_version="${previous_manifest_version%%+*}"
            if [[ -n "$previous_release_version" && "$current_release_version" != "$previous_release_version" ]]; then
              version="$current_release_version"
              tag="v$version"
              should_release=true
            fi
          fi

          version_without_build="${version%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            build_name="${version_without_build%%-*}"
            channel="${version_without_build#*-}"
            channel="${channel%%.*}"
            case "$channel" in
              alpha|beta|rc) ;;
              *) channel="pre-release" ;;
            esac
          else
            build_name="$version_without_build"
            channel="development"
            if [[ "$should_release" == "true" ]]; then
              channel="released"
            fi
          fi

          app_version="$version"
          if [[ "$should_release" == "true" ]]; then
            app_version="v$version"
          fi

          {
            echo "version=$app_version"
            echo "build_name=$build_name"
            echo "channel=$channel"
            echo "tag=$tag"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

  sonarqube:
    needs: [test, build]
    if: >-
      ${{
        vars.SONAR_ORGANIZATION != '' &&
        vars.SONAR_PROJECT_KEY != '' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sample_flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build for SonarQube analysis
        run: flutter build web --release
      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: sample_flutter_app
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=lib
            -Dsonar.tests=test

  build:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: apk
            runner: ubuntu-24.04
            artifact: sample_flutter_app/build/app/outputs/flutter-apk/app-release.apk
          - platform: linux
            runner: ubuntu-24.04
            artifact: sample_flutter_app/build/linux/x64/release/bundle/
          - platform: windows
            runner: windows-latest
            artifact: sample_flutter_app/build/windows/x64/runner/Release/
          - platform: macos
            runner: macos-latest
            artifact: sample_flutter_app/build/macos/Build/Products/Release/sample_flutter_app.app
          - platform: ios
            runner: macos-latest
            artifact: sample_flutter_app/build/ios/iphoneos/Runner.app
          - platform: web
            runner: ubuntu-24.04
            artifact: sample_flutter_app/build/web/
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sample_flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config
      - name: Set up Java for Android
        if: matrix.platform == 'apk'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Build release
        if: matrix.platform != 'ios'
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          APP_BUILD_NAME: ${{ needs.version.outputs.build_name }}
          APP_RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          flutter build ${{ matrix.platform }} --release \
            --build-name="$APP_BUILD_NAME" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="APP_VERSION=$APP_VERSION" \
            --dart-define="APP_RELEASE_CHANNEL=$APP_RELEASE_CHANNEL" \
            --dart-define="APP_REPOSITORY=$GITHUB_REPOSITORY"
      - name: Build iOS release without code signing
        if: matrix.platform == 'ios'
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          APP_BUILD_NAME: ${{ needs.version.outputs.build_name }}
          APP_RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$APP_BUILD_NAME" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="APP_VERSION=$APP_VERSION" \
            --dart-define="APP_RELEASE_CHANNEL=$APP_RELEASE_CHANNEL" \
            --dart-define="APP_REPOSITORY=$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v5
        with:
          name: flutter-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [test, build, sonarqube, version]
    if: >-
      ${{
        always() &&
        needs.version.result == 'success' &&
        needs.version.outputs.should_release == 'true' &&
        needs.test.result == 'success' &&
        needs.build.result == 'success' &&
        (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Archive build artifacts
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          compgen -G "release-assets/flutter-*" >/dev/null || {
            echo "No Flutter build artifacts were downloaded." >&2
            exit 1
          }
          for artifact_dir in release-assets/flutter-*; do
            if [ -d "$artifact_dir" ]; then
              zip -r "${artifact_dir}-${RELEASE_TAG}.zip" "$artifact_dir"
            fi
          done
      - name: Create or verify release tag
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            existing_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$existing_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG already points to a different commit ($existing_commit)." >&2
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          files: release-assets/*.zip
